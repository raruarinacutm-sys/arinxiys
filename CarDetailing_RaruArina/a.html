<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Control | Arhitectură RC 251</title>
    <style>
        /* 1. ARHITECTURA DE SISTEM (Theming Engine - Layer 3 Variables) */
        :root {
            --surface-primary: #ffffff;
            --text-main: #0f172a;
            --surface-secondary: #f1f5f9;
            --accent-neon: #3b82f6;
            --glow-color: rgba(59, 130, 246, 0.4);
            --gpu-opt: transform, opacity;
        }

        .dark-theme {
            --surface-primary: #020617;
            --text-main: #f8fafc;
            --surface-secondary: #1e293b;
            --accent-neon: #00f2ff;
            --glow-color: rgba(0, 242, 255, 0.5);
        }

        body {
            background-color: var(--surface-primary);
            color: var(--text-main);
            transition: all 0.5s ease;
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 2. CENTRUL NEURONAL (Spatial UI - Neural Glass) */
        .neural-glass {
            width: 300px;
            height: 300px;
            margin-top: 50px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transform-style: preserve-3d;
            will-change: var(--gpu-opt);
            box-shadow: 0 0 40px var(--glow-color);
        }

        .neural-glass__core {
            width: 80px;
            height: 80px;
            background: var(--accent-neon);
            border-radius: 50%;
            filter: blur(20px);
            animation: pulse 3s infinite alternate;
        }

        @keyframes pulse { from { opacity: 0.4; } to { opacity: 1; transform: scale(1.2); } }

        /* 3. GRID-UL DE SERVICII (GPU Orchestration & Staggered Entrance) */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 60px 0;
            width: 90%;
            max-width: 900px;
        }

        .service-card {
            background: var(--surface-secondary);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            /* Performanta GPU: Fiecare card are propriul layer */
            will-change: var(--gpu-opt); 
            opacity: 0;
            transform: translateY(30px);
            animation: staggeredEntrance 0.6s ease forwards;
            animation-delay: calc(var(--i) * 0.15s); /* Chained Logic */
        }

        @keyframes staggeredEntrance {
            to { opacity: 1; transform: translateY(0); }
        }

        /* 4. SECURITATE (BEM & CSS State Machine) */
        .access-form {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background: var(--surface-secondary);
            border-radius: 20px;
            margin-bottom: 100px;
        }

        .access-form__title { margin-bottom: 20px; font-size: 1.2rem; }

        .access-form__input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid rgba(128,128,128,0.3);
            background: var(--surface-primary);
            color: var(--text-main);
            border-radius: 8px;
            box-sizing: border-box;
        }

        /* CSS State Machine: Culori neon la validitate */
        .access-form:has(.access-form__input:valid) {
            box-shadow: 0 0 20px var(--glow-color);
            border: 1px solid var(--accent-neon);
        }

        .access-form__button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #475569;
            color: white;
            cursor: not-allowed;
            transition: 0.3s;
        }

        /* Activare buton doar prin :has și :valid */
        .access-form:has(.access-form__input:valid) .access-form__button {
            background: var(--accent-neon);
            cursor: pointer;
            box-shadow: 0 0 10px var(--accent-neon);
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            border: 1px solid var(--accent-neon);
            background: transparent;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <button class="theme-toggle" onclick="toggleTheme()">Schimbă Tema</button>

    <!-- Hologram Centerpiece -->
    <div class="neural-glass" id="neural-center">
        <div class="neural-glass__core"></div>
    </div>

    <!-- GPU Services Grid -->
    <div class="services-grid">
        <div class="service-card" style="--i: 1">Core Engine: Active</div>
        <div class="service-card" style="--i: 2">Neural Link: Online</div>
        <div class="service-card" style="--i: 3">GPU Load: 12%</div>
        <div class="service-card" style="--i: 4">Sync State: Stable</div>
        <div class="service-card" style="--i: 5">Security: Max</div>
        <div class="service-card" style="--i: 6">Uptime: 99.9%</div>
    </div>

    <!-- BEM Access Form -->
    <form class="access-form">
        <h3 class="access-form__title">Protocol de Acces</h3>
        <input type="email" class="access-form__input" placeholder="User ID" required>
        <input type="password" class="access-form__input" placeholder="Passkey" required minlength="6">
        <button type="submit" class="access-form__button">Autorizare</button>
    </form>

    <script>
        // Interaction Logic: Specular Tracking
        const glass = document.getElementById('neural-center');
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 20;
            const y = (window.innerHeight / 2 - e.pageY) / 20;
            glass.style.transform = `rotateX(${y}deg) rotateY(${-x}deg)`;
        });

        // Theme Switcher Logic
        function toggleTheme() {
            document.body.classList.toggle('dark-theme');
        }
    </script>
</body>
</html>
